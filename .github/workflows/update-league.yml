name: Update league status

# Correct the league ladder if it ever drifts from what the game shows.
# Applies as of our most recent league match; later matches move it forward.
on:
  workflow_dispatch:
    inputs:
      division:
        description: "Division"
        type: choice
        options: ["5", "4", "3", "2", "1", "Elite"]
      stage:
        description: "Stage"
        type: choice
        options: [points, promotion, relegation]
      points:
        description: "Points-phase points (blank = 0, or the full target if in promotion matches)"
        required: false
        default: ""
      lives:
        description: "Lives left (blank = 3)"
        required: false
        default: ""
      promo_results:
        description: "Promotion match results so far, e.g. D W (blank if none)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Get the latest data
        run: git pull -q --rebase origin main
      - name: Save league status and rebuild the site
        env:
          DIVISION: ${{ inputs.division }}
          STAGE: ${{ inputs.stage }}
          POINTS: ${{ inputs.points }}
          LIVES: ${{ inputs.lives }}
          PROMO: ${{ inputs.promo_results }}
          NTFY_SECRET: ${{ secrets.NTFY_SECRET }}
        run: |
          args=(--division "$DIVISION" --stage "$STAGE" --promo-results "$PROMO")
          [ -n "$POINTS" ] && args+=(--points "$POINTS")
          [ -n "$LIVES" ] && args+=(--lives "$LIVES")
          python -m fcapp.set_league "${args[@]}"
          python -m fcapp.run --no-fetch --no-notify
      - name: Commit
        run: |
          git config user.name "fc-sync-bot"
          git config user.email "fc-sync-bot@users.noreply.github.com"
          git add data docs
          git commit -m "League status updated from the form" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
