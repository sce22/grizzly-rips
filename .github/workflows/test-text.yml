name: Send test message

# Sends your latest match notes to check notifications. Changes nothing in the repo.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Where to send it"
        type: choice
        options: [all, push, sms]
        default: push
      what:
        description: "Which message"
        type: choice
        options: [match notes, daily summary, daily preview, daily preview (show only)]
        default: match notes
      date:
        description: "Daily summary date YYYY-MM-DD (blank = latest)"
        required: false
        default: ""
      match:
        description: "Match id for match notes (blank = latest)"
        required: false
        default: ""
      players:
        description: "Gamertags, comma-separated (blank = just you)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send test message
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          NTFY_SECRET: ${{ secrets.NTFY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYERS: ${{ inputs.players }}
          WHAT: ${{ inputs.what }}
          DAY: ${{ inputs.date }}
          MATCH: ${{ inputs.match }}
        run: |
          if [ "$WHAT" = "daily preview (show only)" ]; then
            python -m fcapp.run --no-fetch --preview-daily --show-only --date "$DAY"
          elif [ "$WHAT" = "daily preview" ]; then
            python -m fcapp.run --no-fetch --preview-daily --date "$DAY" --players "$PLAYERS"
          elif [ "$WHAT" = "daily summary" ]; then
            python -m fcapp.run --no-fetch --test-daily --date "$DAY" --players "$PLAYERS"
          else
            python -m fcapp.run --no-fetch --test-text --channel "${{ inputs.channel }}" --players "$PLAYERS" --match "$MATCH"
          fi
