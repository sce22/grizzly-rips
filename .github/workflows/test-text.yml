name: Send test message

# Sends your latest match notes to check notifications. Changes nothing in the repo.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Where to send it"
        type: choice
        options: [all, push, sms]
        default: push
      players:
        description: "Gamertags, comma-separated (blank = just you)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send test message
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          NTFY_SECRET: ${{ secrets.NTFY_SECRET }}
          PLAYERS: ${{ inputs.players }}
        run: python -m fcapp.run --no-fetch --test-text --channel "${{ inputs.channel }}" --players "$PLAYERS"
