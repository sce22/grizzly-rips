name: Sync matches

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch: {}       # "Run workflow" button for a manual sync

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, analyse, build, notify
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          PLAYER_PHONES: ${{ secrets.PLAYER_PHONES }}
        run: python -m fcapp.run
      - name: Commit new matches and site
        run: |
          git config user.name "fc-sync-bot"
          git config user.email "fc-sync-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Sync matches $(date -u +%FT%TZ)" && git push)
