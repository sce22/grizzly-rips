name: Match watcher

# Checks EA every minute and notifies players as soon as a match lands.
# A job can run for at most 6 hours, so each run starts its own successor when
# it finishes (GitHub's scheduler can lag by hours on new repos; the schedule
# below is only a backup). Only one runs at a time; a successor waits in the
# queue until the current one finishes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "fc-sync-bot"
          git config user.email "fc-sync-bot@users.noreply.github.com"
      - name: Watch for matches
        id: watch
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          NTFY_SECRET: ${{ secrets.NTFY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYER_SMS: ${{ secrets.PLAYER_SMS }}
        run: python -m fcapp.watch --minutes 330 --interval 60
      - name: Start the next watcher
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the watcher crashed, pause before restarting so a bug can't spin in a tight loop
          if [ "${{ steps.watch.outcome }}" != "success" ]; then sleep 300; fi
          gh workflow run sync.yml --repo "${{ github.repository }}" --ref main
