name: Match watcher

# Checks EA every minute and texts as soon as a match lands. A job can run for
# at most 6 hours, so the schedule below restarts the watcher; only one runs
# at a time and a restart waits in the queue until the current one finishes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "fc-sync-bot"
          git config user.email "fc-sync-bot@users.noreply.github.com"
      - name: Watch for matches
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_GATEWAY_ADDRESS: ${{ secrets.SMS_GATEWAY_ADDRESS }}
          NTFY_SECRET: ${{ secrets.NTFY_SECRET }}
          PLAYER_SMS: ${{ secrets.PLAYER_SMS }}
        run: python -m fcapp.watch --minutes 330 --interval 60
